# docker-compose.pulled.yml
services:
  backend:
    image: heymeasm/image-enhancer-backend:1.0.0
    environment:
      - DB_HOST=db
      - DB_NAME=image_enhancer
      - DB_USER=app_user
      - DB_PASSWORD=app_password
    volumes:
      - enhanced-images:/app/uploads
    networks: [enhancer-net]
    depends_on:
      db:
        condition: service_healthy
 
  frontend:
    image: heymeasm/image-enhancer-frontend:1.0.0
    ports: ["8080:80"]
    networks: [enhancer-net]
    depends_on:
      - backend
   
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=image_enhancer
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password
    volumes: [db-data:/var/lib/postgresql/data]
    networks: [enhancer-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d image_enhancer"]
 
networks:
  enhancer-net:
volumes:
  enhanced-images:
  db-data:
